<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock - StockIt</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body data-page="stock">
<div id="page">
  <div id="hd" class="page-head" style="align-items:flex-start">
    <div>
      <h1 id="name">Loading...</h1>
      <div class="muted" style="margin-top:4px"><span id="sym"></span> · NSE · <span class="badge">End of Day</span> <span id="asof"></span></div>
    </div>
    <div style="text-align:right"><div class="price" id="price">—</div><div id="chg" class="muted">—</div></div>
  </div>

  <div class="card" id="chartCard">
    <div class="page-head" style="margin-bottom:10px">
      <h2 style="margin:0">Price chart</h2>
      <div class="seg" id="rng">
        <button data-d="30">1M</button><button data-d="90">3M</button><button data-d="180" class="on">6M</button><button data-d="365">1Y</button>
      </div>
    </div>
    <div id="chart" style="height:380px"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <p class="note">Daily candles from NSE End of Day data. Not live prices.</p>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Key numbers</h2>
    <div class="grid gs" id="stats"><div class="sk"></div></div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Fundamentals</h2><div class="na">Data Unavailable</div></div>
    <div class="card"><h2>Revenue &amp; Expenses</h2><div class="na">Data Unavailable</div></div>
    <div class="card"><h2>Shareholding</h2><div class="na">Data Unavailable</div></div>
    <div class="card"><h2>News &amp; Corporate Actions</h2><div class="na">Data Unavailable</div></div>
  </div>
</div>

<script>
StockIt.ready(function () {
  var S = StockIt, $ = function (i) { return document.getElementById(i); };
  var sym = (new URLSearchParams(location.search).get('symbol') || '').trim().toUpperCase();

  if (!sym) {
    $('name').textContent = 'Stock';
    $('sym').textContent = 'Use the search box above to open a stock.';
    $('chartCard').style.display = 'none';
    $('stats').parentNode.style.display = 'none';
    return;
  }
  document.title = sym + ' - StockIt';
  $('name').textContent = sym;
  $('sym').textContent = sym;

  fetch(S.api + '/api/search?q=' + encodeURIComponent(sym))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var m = (j.results || []).filter(function (x) { return x.symbol === sym; })[0];
      if (m && m.name) $('name').textContent = m.name;
    }).catch(function () {});

  function cv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function unavailable(msg) {
    $('chart').innerHTML = S.na(msg);
    $('stats').innerHTML = S.na(msg);
    $('price').textContent = '\u2014';
    $('chg').textContent = 'Data Unavailable';
  }

  fetch(S.api + '/api/prices?symbol=' + encodeURIComponent(sym) + '&days=365')
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      var all = (j.candles || []).filter(function (c) {
        return c.open != null && c.high != null && c.low != null && c.close != null;
      });
      if (!all.length) { unavailable('Data Unavailable \u2014 no price data loaded for this stock.'); return; }
      var last = all[all.length - 1];

      // Header
      $('price').textContent = S.fmt(last.close);
      $('asof').textContent = last.time;
      var ch = last.prev_close ? ((last.close - last.prev_close) / last.prev_close * 100) : null;
      var chAbs = last.prev_close ? (last.close - last.prev_close) : null;
      $('chg').className = ch > 0 ? 'up' : (ch < 0 ? 'down' : 'muted');
      $('chg').textContent = ch == null ? 'Data Unavailable' : ((chAbs > 0 ? '+' : '') + S.fmt(chAbs) + '  (' + S.pct(ch) + ')');

      // Stats
      var hi = Math.max.apply(null, all.map(function (c) { return c.high; }));
      var lo = Math.min.apply(null, all.map(function (c) { return c.low; }));
      var enough = all.length >= 240;
      var cells = [
        ['Open', S.fmt(last.open)], ['High', S.fmt(last.high)], ['Low', S.fmt(last.low)], ['Close', S.fmt(last.close)],
        ['Prev close', S.fmt(last.prev_close)],
        ['Volume', last.volume == null ? '\u2014' : Number(last.volume).toLocaleString('en-IN')],
        ['52W high', enough ? S.fmt(hi) : 'Data Unavailable'],
        ['52W low', enough ? S.fmt(lo) : 'Data Unavailable']
      ];
      $('stats').innerHTML = cells.map(function (c) { return '<div class="stat"><span>' + c[0] + '</span><b>' + c[1] + '</b></div>'; }).join('');

      // Chart
      if (!window.LightweightCharts) { $('chart').innerHTML = S.na('Chart Unavailable'); return; }
      var el = $('chart'); el.innerHTML = '';
      var chart = LightweightCharts.createChart(el, {
        width: el.clientWidth, height: 380,
        layout: { background: { type: 'solid', color: cv('--surface') }, textColor: cv('--muted') },
        grid: { vertLines: { color: cv('--border') }, horzLines: { color: cv('--border') } },
        rightPriceScale: { borderColor: cv('--border') },
        timeScale: { borderColor: cv('--border') }
      });
      var cs = chart.addCandlestickSeries({ borderVisible: false });
      var vs = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
      vs.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
      var days = 180;

      function draw() {
        var up = cv('--up'), down = cv('--down');
        chart.applyOptions({
          layout: { background: { type: 'solid', color: cv('--surface') }, textColor: cv('--muted') },
          grid: { vertLines: { color: cv('--border') }, horzLines: { color: cv('--border') } },
          rightPriceScale: { borderColor: cv('--border') }, timeScale: { borderColor: cv('--border') }
        });
        cs.applyOptions({ upColor: up, downColor: down, wickUpColor: up, wickDownColor: down });
        var cut = new Date(new Date(last.time + 'T00:00:00Z').getTime() - days * 86400000).toISOString().slice(0, 10);
        var part = all.filter(function (c) { return c.time >= cut; });
        cs.setData(part.map(function (c) { return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; }));
        vs.setData(part.map(function (c) { return { time: c.time, value: c.volume || 0, color: (c.close >= c.open ? up : down) + '66' }; }));
        chart.timeScale().fitContent();
      }
      draw();
      window.addEventListener('themechange', draw);
      if (window.ResizeObserver) new ResizeObserver(function () { chart.applyOptions({ width: el.clientWidth }); }).observe(el);

      $('rng').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        days = parseInt(b.getAttribute('data-d'), 10);
        Array.prototype.forEach.call($('rng').children, function (x) { x.classList.toggle('on', x === b); });
        draw();
      });
    })
    .catch(function () { unavailable('Data Unavailable'); });
});
</script>
</body>
</html>
